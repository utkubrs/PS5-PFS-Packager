name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: checkboxes
    attributes:
      label: Safety confirmation
      options:
        - label: I tested with a backup or disposable image.
          required: true
        - label: I removed copyrighted content and private paths from logs.
          required: true
  - type: input
    attributes:
      label: Application version
      placeholder: "2.13.0"
    validations:
      required: true
  - type: input
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Workflow
      options:
        - Game folder to FFPFSC
        - exFAT to FFPFSC
        - Open/edit exFAT
        - Open/edit FFPFSC
        - Batch conversion
        - Build from source
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual result and relevant log lines
    validations:
      required: true
  - type: input
    attributes:
      label: Profile / CPU / compression / block
      placeholder: "Balanced / 5 / 7 / auto"
