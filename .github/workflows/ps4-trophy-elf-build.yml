name: Experimental ShadowMountPlus PS4 Trophy ELF Build

on:
  push:
    branches:
      - experimental/ps4-trophy-compat-beta5fix1
    paths:
      - "experiments/shadowmountplus-ps4-trophy-compat/**"
      - ".github/workflows/ps4-trophy-elf-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-experimental-elf:
    name: Build PS5 ELF (experimental, PS4 trophy staging)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
      - name: Checkout pinned ShadowMountPlus 1.7-beta5fix1
        run: |
          set -euo pipefail
          git clone https://github.com/drakmor/ShadowMountPlus.git smp-upstream
          git -C smp-upstream checkout --detach 98c524890176c7b474fcb03387bec88c4a559861
          test "$(git -C smp-upstream rev-parse HEAD)" = "98c524890176c7b474fcb03387bec88c4a559861"
      - name: Apply isolated experiment patch and regression tests
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/experiments/shadowmountplus-ps4-trophy-compat"
          bash "$root/tests/run_host_tests.sh"
          cd smp-upstream
          git apply --check "$root/patches/0001-ps4-trophy-metadata-staging.patch"
          git apply "$root/patches/0001-ps4-trophy-metadata-staging.patch"
          cp "$root/include/sm_ps4_trophy_compat.h" include/
          cp "$root/src/sm_ps4_trophy_compat.c" src/
          python3 "$root/check_integration.py" .
      - name: Checkout pacbrew dependency packages
        uses: actions/checkout@v4
        with:
          repository: ps5-payload-dev/pacbrew-repo
          path: pacbrew-repo
      - name: Checkout PS5 SDK stubs
        uses: actions/checkout@v4
        with:
          repository: ps5-payload-dev/sdk
          path: ps5-sdk
      - name: Install PS5 build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential clang-18 cmake curl git \
            libarchive-tools libtool lld-18 makepkg meson \
            pacman-package-manager pkg-config python3 python3-yaml xxd zip
      - name: Build PS5 SDK and dependencies (same method as upstream)
        run: |
          set -euo pipefail
          for package in sdk openlibm json-c zlib libpng libmicrohttpd sqlite; do
            echo "::group::PS5 package: $package"
            pushd "pacbrew-repo/$package"
            makepkg -c -f
            sudo pacman --noconfirm -U ./ps5-payload-*.pkg.tar.gz
            popd
            echo "::endgroup::"
          done
      - name: Cross-compile experimental ShadowMountPlus payload
        working-directory: smp-upstream
        run: |
          set -euo pipefail
          make clean all PS5_SCE_STUBS_DIR="$GITHUB_WORKSPACE/ps5-sdk/sce_stubs"
          test -s shadowmountplus.elf
      - name: Inspect and package experimental ELF
        run: |
          set -euo pipefail
          mkdir -p dist
          cp smp-upstream/shadowmountplus.elf dist/ShadowMountPlus-1.7-beta5fix1-PS4Trophy-EXP1.elf
          file dist/*.elf
          readelf -h dist/*.elf
          (cd dist && sha256sum *.elf | tee SHA256SUMS.txt)
          printf '%s\n' \
            'EXPERIMENTAL ONLY: PS4 trophy metadata staging. Not console-tested.' \
            'Does NOT guarantee trophy registration or fix LNC/NPDRM launch.' \
            'Keep original ShadowMountPlus 1.7-beta5fix1 for rollback.' \
            'Upstream: drakmor/ShadowMountPlus @ 98c524890176c7b474fcb03387bec88c4a559861' \
            'Experiment branch: utkubrs/PS5-PFS-Packager experimental/ps4-trophy-compat-beta5fix1' \
            > dist/READ_ME_FIRST.txt
      - name: Upload experiment ELF (not a GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: ShadowMountPlus-PS4Trophy-EXP1-ELF
          path: dist/*
          if-no-files-found: error
          retention-days: 30
