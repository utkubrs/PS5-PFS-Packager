name: EXP3A ShadowMountPlus PS4 Prelaunch Metadata Mirror

on:
  push:
    branches:
      - experimental/ps4-trophy-exp3a-launch-mirror
    paths:
      - "experiments/shadowmountplus-ps4-trophy-compat/**"
      - ".github/workflows/ps4-trophy-exp3a-prelaunch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-experimental-elf:
    name: Build PS5 ELF (EXP3A prelaunch mirror for existing games)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
      - name: Checkout pinned ShadowMountPlus 1.7-beta5fix1
        run: |
          set -euo pipefail
          git clone https://github.com/drakmor/ShadowMountPlus.git smp-upstream
          git -C smp-upstream checkout --detach 98c524890176c7b474fcb03387bec88c4a559861
          test "$(git -C smp-upstream rev-parse HEAD)" = "98c524890176c7b474fcb03387bec88c4a559861"
      - name: Apply isolated experiment patch and regression tests
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/experiments/shadowmountplus-ps4-trophy-compat"
          cd smp-upstream
          git apply --check "$root/patches/0002a-minimal-boot-probe.patch"
          git apply "$root/patches/0002a-minimal-boot-probe.patch"
          git apply --check "$root/patches/0002b-appdb-readonly-snapshot.patch"
          git apply "$root/patches/0002b-appdb-readonly-snapshot.patch"
          git apply --check "$root/patches/0003-ps4-optin-user-appmeta-mirror.patch"
          git apply "$root/patches/0003-ps4-optin-user-appmeta-mirror.patch"
          git apply --check "$root/patches/0004-exp3a-prelaunch-registered-ffpfsc.patch"
          git apply "$root/patches/0004-exp3a-prelaunch-registered-ffpfsc.patch"
          grep -q 'void sm_install_exp3_launch_probe' src/sm_install.c
          grep -q 'launch-prep title=' src/sm_install.c
          test "$(grep -c 'sm_install_exp3_launch_probe(title_id, source_path);' src/sm_shellcore_service.c)" -eq 2
          test "$(grep -c 'if (launch_request)' src/sm_shellcore_service.c)" -ge 2
          python3 "$root/tests/run_exp3_host_tests.py" src/sm_install.c
          grep -q 'exp3_ps4_mirror_on_mount(title_id, src_sce_sys, user_appmeta_dir);' src/sm_install.c
          grep -q 'sqlite3_open_v2(APP_DB_PATH, &db, SQLITE_OPEN_READONLY, NULL)' src/sm_appdb.c
          grep -q 'sm_appdb_exp2b_log_registration(title_id);' src/sm_game_lifecycle.c
          grep -q 'PS4-TROPHY-EXP2A.*boot-check' src/sm_shellcore_hooks.c
          grep -q 'PS4-TROPHY-EXP2A.*game-check' src/sm_game_lifecycle.c
          ! grep -R -q 'PS4-TROPHY-EXPERIMENT' src include
      - name: Checkout pacbrew dependency packages
        uses: actions/checkout@v4
        with:
          repository: ps5-payload-dev/pacbrew-repo
          path: pacbrew-repo
      - name: Checkout PS5 SDK stubs
        uses: actions/checkout@v4
        with:
          repository: ps5-payload-dev/sdk
          path: ps5-sdk
      - name: Install PS5 build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential clang-18 cmake curl git \
            libarchive-tools libtool lld-18 makepkg meson \
            pacman-package-manager pkg-config python3 python3-yaml xxd zip
      - name: Build PS5 SDK and dependencies (same method as upstream)
        run: |
          set -euo pipefail
          for package in sdk openlibm json-c zlib libpng libmicrohttpd sqlite; do
            echo "::group::PS5 package: $package"
            pushd "pacbrew-repo/$package"
            makepkg -c -f
            sudo pacman --noconfirm -U ./ps5-payload-*.pkg.tar.gz
            popd
            echo "::endgroup::"
          done
      - name: Cross-compile experimental ShadowMountPlus payload
        working-directory: smp-upstream
        run: |
          set -euo pipefail
          make clean all PS5_SCE_STUBS_DIR="$GITHUB_WORKSPACE/ps5-sdk/sce_stubs"
          test -s shadowmountplus.elf
      - name: Inspect and package experimental ELF
        run: |
          set -euo pipefail
          mkdir -p dist
          cp smp-upstream/shadowmountplus.elf dist/ShadowMountPlus-1.7-beta5fix1-EXP3A-Prelaunch.elf
          file dist/*.elf
          readelf -h dist/*.elf
          (cd dist && sha256sum *.elf | tee SHA256SUMS.txt)
          printf '%s\n' \
            'EXP3A: EXP2B + opt-in PS4 metadata mirror at prelaunch for already-installed FFPFSC. Not console-tested.' \
            'Still requires /data/shadowmount/exp3_CUSA#####.enable. Never overwrites metadata or app.db. Not proven trophy fix.' \
            'Keep original ShadowMountPlus 1.7-beta5fix1 for rollback.' \
            'Upstream: drakmor/ShadowMountPlus @ 98c524890176c7b474fcb03387bec88c4a559861' \
            'Experiment branch: utkubrs/PS5-PFS-Packager experimental/ps4-trophy-exp3a-launch-mirror' \
            > dist/READ_ME_FIRST.txt
      - name: Upload experiment ELF (not a GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: ShadowMountPlus-EXP3A-Prelaunch-ELF
          path: dist/*
          if-no-files-found: error
          retention-days: 30
