name: Test PS4 one-click workflow

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/ps4-tests.yml"
  push:
    branches:
      - "feature/ps4-one-click-ffpfsc"
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/ps4-tests.yml"
  workflow_dispatch:

jobs:
  ps4-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Run PS4 input and merge tests
        run: python -m unittest discover -s tests -p "test_ps4*.py" -v
