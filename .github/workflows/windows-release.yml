name: Build and publish Windows package
# v1.0 standalone EXE; publish and prune old release versions after smoke tests.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/build_windows.bat'
      - '.github/workflows/windows-release.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Test PS4 input handling
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_ps4*.py" -v
          if ($LASTEXITCODE -ne 0) { throw 'PS4 tests failed' }
          python -m unittest discover -s tests -p "test_ffpfsc_to_pkg.py" -v
          if ($LASTEXITCODE -ne 0) { throw 'FFPFSC to PKG tests failed' }

      - name: Fetch pinned PS4 PKG extractor (Windows x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/paulomanrique/ps4-pkg-extractor/releases/download/v0.0.1/pkgextract-x86_64-pc-windows-msvc.zip'
          $checksum = '0c736ee02779fb5cf4403a91da23f94fdaa72debf995be0c400ac9c36acee63a'
          New-Item -ItemType Directory -Force 'tools' | Out-Null
          Invoke-WebRequest -Uri $url -OutFile 'pkgextract-download.zip'
          $actual = (Get-FileHash 'pkgextract-download.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $checksum) { throw "Unexpected extractor archive SHA256: $actual" }
          Expand-Archive -Path 'pkgextract-download.zip' -DestinationPath 'tools' -Force
          $candidate = Get-ChildItem tools -Recurse -Filter 'pkgextract.exe' -File | Select-Object -First 1
          if (!$candidate) { throw 'pkgextract.exe missing from downloaded archive' }
          if ($candidate.FullName -ne (Join-Path (Resolve-Path tools).Path 'pkgextract.exe')) {
            Copy-Item $candidate.FullName 'tools/pkgextract.exe' -Force
          }
          if (!(Test-Path 'tools/pkgextract.exe')) { throw 'Extractor verification failed' }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build pinned open-source GP4 generator (.NET 10, self-contained)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = '5cd42a515dc29a453c7abcb93318493bdb5b5e1f'
          git clone --no-checkout https://github.com/pearlxcore/OrbisPkgTool.git orbis-src
          git -C orbis-src checkout $sha
          $actual = (git -C orbis-src rev-parse HEAD).Trim()
          if ($actual -ne $sha) { throw 'Unpinned builder source revision' }
          dotnet publish 'orbis-src/OrbisPkgTool/OrbisPkgTool.csproj' -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:IncludeNativeLibrariesForSelfExtract=true -o 'orbis-out'
          if ($LASTEXITCODE -ne 0) { throw 'OrbisPkgTool build failed' }
          Copy-Item 'orbis-out/OrbisPkgTool.exe' 'tools/OrbisPkgTool.exe' -Force
          Copy-Item 'orbis-src/LICENSE' 'tools/OrbisPkgTool.LICENSE.txt' -Force
          $help = & 'tools/OrbisPkgTool.exe' --help 2>&1
          if ($LASTEXITCODE -ne 0 -or ($help -join ' ') -notmatch 'gp4gen') { throw 'PS4 PKG CLI smoke test failed' }
          Write-Host 'PS4 GP4 generator ready, license notice included'

      - name: Build executable
        shell: cmd
        run: call scripts\build_windows.bat <nul

      - name: Smoke test embedded GP4 generator
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = 'tools/OrbisPkgTool.exe'
          if (!(Test-Path $cli)) { throw 'GP4 generator missing' }
          $output = & $cli gp4gen --help 2>&1
          if ($LASTEXITCODE -ne 0 -or ($output -join ' ') -notmatch 'gp4') { throw 'PS4 GP4 generation not available' }

      - name: Smoke test bundled PKG extractor from isolated EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $original = (Resolve-Path 'dist/ps5_pfs_packager.dist/PS5-PFS-Packager.exe').Path
          $isolated = Join-Path $env:RUNNER_TEMP 'Standalone Test With Spaces'
          New-Item -ItemType Directory -Force $isolated | Out-Null
          $exe = Join-Path $isolated 'PS5-PFS-Packager.exe'
          Copy-Item $original $exe -Force
          if (Test-Path (Join-Path $isolated 'tools/pkgextract.exe')) {
            throw 'Test invalid: isolated EXE unexpectedly has external pkgextract'
          }
          $stdoutFile = Join-Path $env:RUNNER_TEMP 'pkgextract-check.out'
          $stderrFile = Join-Path $env:RUNNER_TEMP 'pkgextract-check.err'
          $proc = Start-Process -FilePath $exe -ArgumentList '--check-pkg-extractor' -RedirectStandardOutput $stdoutFile -RedirectStandardError $stderrFile -PassThru -Wait
          $out = (Get-Content $stdoutFile -Raw -ErrorAction SilentlyContinue) + (Get-Content $stderrFile -Raw -ErrorAction SilentlyContinue)
          Write-Host $out
          if ($proc.ExitCode -ne 0 -or $out -notmatch 'PKG_EXTRACTOR_OK:') {
            throw "Bundled PKG extractor missing from onefile executable; exit=$($proc.ExitCode)"
          }

      - name: Smoke test standalone MkPFS child invocation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "dist/ps5_pfs_packager.dist/PS5-PFS-Packager.exe"
          if (!(Test-Path $exe)) {
            Write-Host 'Build output inventory:'
            Get-ChildItem dist -Recurse -File | Select-Object -First 60 -ExpandProperty FullName
            throw "Standalone EXE missing"
          }
          $log = Join-Path $env:RUNNER_TEMP 'mkpfs-smoke.txt'
          $err = Join-Path $env:RUNNER_TEMP 'mkpfs-smoke-error.txt'
          $proc = Start-Process -FilePath (Resolve-Path $exe) -ArgumentList @('--internal-mkpfs','--help') -RedirectStandardOutput $log -RedirectStandardError $err -Wait -PassThru
          $output = (Get-Content $log -Raw -ErrorAction SilentlyContinue) + (Get-Content $err -Raw -ErrorAction SilentlyContinue)
          Write-Host $output
          if ($proc.ExitCode -ne 0 -or $output -match 'Error, load DLL') { throw "MkPFS subprocess smoke test failed with exit $($proc.ExitCode)" }

      - name: Smoke test MkPFS pack folder (same path as GUI)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'dist/ps5_pfs_packager.dist/PS5-PFS-Packager.exe').Path
          $work = Join-Path $env:RUNNER_TEMP 'ps4-pack-smoke'
          $src = Join-Path $work 'game'
          $output = Join-Path $work 'CUSA12381.ffpfsc'
          New-Item -ItemType Directory -Force $src | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $src 'eboot.bin'), [byte[]](0..127))
          [IO.File]::WriteAllText((Join-Path $src 'readme.txt'), 'Synthetic MkPFS smoke-test payload')
          # The merge staging directory MUST NOT become the nested image name.
          # ShadowMount+ needs sce_sys/param.json within the wrapped exFAT.
          $meta = Join-Path $src 'sce_sys'
          New-Item -ItemType Directory -Force $meta | Out-Null
          [IO.File]::WriteAllText((Join-Path $meta 'param.json'), '{"titleId":"CUSA12381","titleName":"Chim Party (TR)","localizedParameters":{"en-US":{"titleName":"Chim Party (TR)"}}}')
          $env:TEMP = $work
          $env:TMP = $work
          $log = Join-Path $env:RUNNER_TEMP 'mkpfs-real-pack-out.txt'
          $err = Join-Path $env:RUNNER_TEMP 'mkpfs-real-pack-err.txt'
          $args = @('--internal-mkpfs', 'pack', 'folder',
            '--compress', '--threshold-gain', '0', '--max-compressed-ratio', '100',
            '--no-adjust-output-file-extension', '--version', 'PS5',
            '--inode-bits', '32', '--temp-folder', $work,
            '--cpu-count', '2', '--compression-level', '1',
            '--block-size', 'auto', '--no-verify-structure', $src, $output)
          $proc = Start-Process -FilePath $exe -ArgumentList $args -RedirectStandardOutput $log -RedirectStandardError $err -Wait -PassThru
          $stdout = Get-Content $log -Raw -ErrorAction SilentlyContinue
          $stderr = Get-Content $err -Raw -ErrorAction SilentlyContinue
          Write-Host $stdout
          Write-Host $stderr
          if ($proc.ExitCode -ne 0 -or ($stdout + $stderr) -match 'Error, load DLL') {
            throw "Actual MkPFS pack folder smoke test failed: $($proc.ExitCode)"
          }
          if (!(Test-Path $output) -or (Get-Item $output).Length -lt 1024) {
            throw 'MkPFS did not create a valid-sized FFPFSC output'
          }
          # Compare with the known-working PS4 PKG Tool: PS4 game content must
          # reside in an OUTER PS5-profile PFS (version 2, not PS4 version 1).
          $stream = [IO.File]::OpenRead($output)
          try {
            $hdr = New-Object byte[] 80
            if ($stream.Read($hdr, 0, 80) -ne 80) { throw 'Truncated outer PFS header' }
            $pfsVersion = [BitConverter]::ToInt64($hdr, 0)
            $pfsMagic = [BitConverter]::ToInt64($hdr, 8)
            $pfsBlock = [BitConverter]::ToUInt32($hdr, 0x20)
          } finally { $stream.Dispose() }
          if ($pfsVersion -ne 2 -or $pfsMagic -ne 20130315 -or $pfsBlock -ne 65536) {
            throw "Incorrect outer PFS header: version=$pfsVersion magic=$pfsMagic block=$pfsBlock (expected PS5 v2, 64 KiB)"
          }
          Write-Host 'OUTER PS5 PFS v2 verified; PS4 game content preserved.'
          # Inspect the real outer PFSC image to prevent the previous bug:
          # ps4_merge_<random>.exfat instead of CUSA12381.exfat.
          $outer = Join-Path $work 'inspect_outer'
          $inner = Join-Path $work 'inspect_inner'
          $extractLog = Join-Path $env:RUNNER_TEMP 'mkpfs-image-inspect.txt'
          $extractErr = Join-Path $env:RUNNER_TEMP 'mkpfs-image-inspect.err'
          $unpack = Start-Process -FilePath $exe -ArgumentList @(
            '--internal-mkpfs','unpack',$output,$outer
          ) -RedirectStandardOutput $extractLog -RedirectStandardError $extractErr -Wait -PassThru
          if ($unpack.ExitCode -ne 0) {
            Write-Host (Get-Content $extractLog -Raw -ErrorAction SilentlyContinue)
            Write-Host (Get-Content $extractErr -Raw -ErrorAction SilentlyContinue)
            throw "PFSC outer unpack failed: $($unpack.ExitCode)"
          }
          $nested = Get-ChildItem -Path $outer -Recurse -Filter '*.exfat' -File
          if ($nested.Count -ne 1 -or $nested[0].Name -cne 'CUSA12381.exfat') {
            throw "Wrong nested exFAT name; expected CUSA12381.exfat, got: $($nested.Name -join ', ')"
          }
          $deep = Start-Process -FilePath $exe -ArgumentList @(
            '--internal-mkpfs','unpack','--deep',$output,$inner
          ) -RedirectStandardOutput $extractLog -RedirectStandardError $extractErr -Wait -PassThru
          if ($deep.ExitCode -ne 0) {
            throw "PFSC nested exFAT unpack failed: $($deep.ExitCode)"
          }
          $json = Join-Path $inner 'sce_sys/param.json'
          if (!(Test-Path $json)) {
            throw 'Missing sce_sys/param.json from nested exFAT root'
          }
          $id = (Get-Content $json -Raw | ConvertFrom-Json).titleId
          if ($id -ne 'CUSA12381') {
            throw "Incorrect nested ShadowMount+ PS4 titleId: $id"
          }
          Write-Host 'FFPFSC LAYOUT OK: CUSA12381.exfat -> sce_sys/param.json'

      - name: Stage portable v1.0 EXE and verify checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -ne '1.0') { throw "Unexpected version: $version" }
          New-Item -ItemType Directory -Force release | Out-Null
          $source = 'dist/ps5_pfs_packager.dist/PS5-PFS-Packager.exe'
          $releaseExe = 'release/PS5-PFS-Packager.exe'
          if (!(Test-Path $source)) { throw 'Standalone onefile executable missing' }
          Copy-Item $source $releaseExe -Force
          $sourceHash = (Get-FileHash $source -Algorithm SHA256).Hash
          $releaseHash = (Get-FileHash $releaseExe -Algorithm SHA256).Hash
          if ($sourceHash -ne $releaseHash) { throw 'Release executable checksum mismatch' }
          if ((Get-Item $releaseExe).Length -lt 1MB) { throw 'Executable looks truncated' }
          Write-Host "EXE ready, SHA256: $releaseHash"

      - name: Smoke test final downloadable EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'release/PS5-PFS-Packager.exe').Path
          $isolated = Join-Path $env:RUNNER_TEMP 'Standalone Final With Spaces'
          New-Item -ItemType Directory -Force $isolated | Out-Null
          $target = Join-Path $isolated 'PS5-PFS-Packager.exe'
          Copy-Item $exe $target
          $log = Join-Path $env:RUNNER_TEMP 'final-exe-test.log'
          $err = Join-Path $env:RUNNER_TEMP 'final-exe-test.err'
          $proc = Start-Process -FilePath $target -ArgumentList '--check-pkg-extractor' -RedirectStandardOutput $log -RedirectStandardError $err -PassThru -Wait
          $output = (Get-Content $log -Raw -ErrorAction SilentlyContinue) + (Get-Content $err -Raw -ErrorAction SilentlyContinue)
          Write-Host $output
          if ($proc.ExitCode -ne 0 -or $output -notmatch 'PKG_EXTRACTOR_OK:') {
            throw "Standalone EXE failed bundled PKG extractor check: $($proc.ExitCode)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: PS5-PFS-Packager-v1.0-EXE
          path: release/*.exe
          if-no-files-found: error

      - name: Update existing v1.0 release with PS5-PFS-Packager.exe
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -ne 'utkubrs/PS5-PFS-Packager') { throw 'Unexpected repository' }
          $tag = 'v1.0'
          $exe = 'release/PS5-PFS-Packager.exe'
          if (!(Test-Path $exe)) { throw 'No v1.0 EXE to publish' }
          $sha256 = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            throw 'Existing v1.0 release not found; will NOT create a new release'
          }
          # The release already exists, so move the v1.0 tag to the tested source.
          gh api -X PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$env:GITHUB_SHA" -F force=true | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Failed to move v1.0 tag' }
          gh release upload $tag $exe --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'EXE upload failed' }
          $notes = @"
          PS5 PFS Packager v1.0 - Windows x64 portable standalone executable.
          
          PS4 FFPFSC to PKG: MkPFS deep unpack, PS4 SFO validation, automatic GP4 generation with embedded open-source OrbisPkgTool, and PKG building through the user's own installed orbis-pub-cmd.exe and ext directory. Sony Orbis tools are not bundled. PS5 PKG building is not supported.
          PS4 Game + Update Merge: missing sce_sys/pic0.png or pic0.dds is repaired by renaming staged pic1.png or pic1.dds; existing pic0 remains untouched.
          Custom game names apply to all existing PARAM.SFO TITLE and TITLE_XX fields.
          TITLE_ID, CONTENT_ID, APP_VER and base/update source files remain untouched.
          
          Install: download the EXE and run it; no ZIP or Python installation required.
          MkPFS 1.1.0 and the PS4 PKG extractor are embedded. See README.md in the repository for instructions and license notices.
          
          SHA256: $sha256
          "@
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --title 'PS5 PFS Packager v1.0' --notes $notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release notes update failed' }
          # Remove previous v1.0 ZIP/checksum assets; offer only one EXE.
          $assets = @(gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot list release assets' }
          foreach ($asset in $assets) {
            if ($asset -ne 'PS5-PFS-Packager.exe') {
              gh release delete-asset $tag $asset --yes --repo $env:GITHUB_REPOSITORY
              if ($LASTEXITCODE -ne 0) { throw "Failed to remove old asset: $asset" }
            }
          }
          Write-Host "Release now contains the standalone EXE only (plus GitHub automatic source code archives)."

      - name: Verify v1.0 remains the only release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releases = @(gh release list --repo $env:GITHUB_REPOSITORY --limit 1000 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0 -or $releases.Count -ne 1 -or $releases[0] -ne 'v1.0') {
            throw 'Expected only the existing v1.0 release'
          }
          $assets = @(gh release view v1.0 --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0 -or $assets.Count -ne 1 -or $assets[0] -ne 'PS5-PFS-Packager.exe') {
            throw 'Expected the sole v1.0 release asset to be PS5-PFS-Packager.exe'
          }
          Write-Host 'Existing v1.0 release verified; one EXE asset; no other release created.'
