name: Build and publish Windows package
# v2.20.0 release build: one push-triggered run for workflow changes; manual thereafter.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:

concurrency:
  group: windows-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Test PS4 input handling
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_ps4*.py" -v

      - name: Fetch pinned PS4 PKG extractor (Windows x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/paulomanrique/ps4-pkg-extractor/releases/download/v0.0.1/pkgextract-x86_64-pc-windows-msvc.zip'
          $checksum = '0c736ee02779fb5cf4403a91da23f94fdaa72debf995be0c400ac9c36acee63a'
          New-Item -ItemType Directory -Force 'tools' | Out-Null
          Invoke-WebRequest -Uri $url -OutFile 'pkgextract-download.zip'
          $actual = (Get-FileHash 'pkgextract-download.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $checksum) { throw "Unexpected extractor archive SHA256: $actual" }
          Expand-Archive -Path 'pkgextract-download.zip' -DestinationPath 'tools' -Force
          $candidate = Get-ChildItem tools -Recurse -Filter 'pkgextract.exe' -File | Select-Object -First 1
          if (!$candidate) { throw 'pkgextract.exe missing from downloaded archive' }
          if ($candidate.FullName -ne (Join-Path (Resolve-Path tools).Path 'pkgextract.exe')) {
            Copy-Item $candidate.FullName 'tools/pkgextract.exe' -Force
          }
          if (!(Test-Path 'tools/pkgextract.exe')) { throw 'Extractor verification failed' }

      - name: Build executable
        shell: cmd
        run: call scripts\build_windows.bat <nul

      - name: Smoke test standalone MkPFS child invocation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "dist/ps5_pfs_packager.dist/PS5-PFS-Packager.exe"
          if (!(Test-Path $exe)) { throw "Standalone EXE missing" }
          $log = Join-Path $env:RUNNER_TEMP 'mkpfs-smoke.txt'
          $err = Join-Path $env:RUNNER_TEMP 'mkpfs-smoke-error.txt'
          $proc = Start-Process -FilePath (Resolve-Path $exe) -ArgumentList @('--internal-mkpfs','--help') -RedirectStandardOutput $log -RedirectStandardError $err -Wait -PassThru
          $output = (Get-Content $log -Raw -ErrorAction SilentlyContinue) + (Get-Content $err -Raw -ErrorAction SilentlyContinue)
          Write-Host $output
          if ($proc.ExitCode -ne 0 -or $output -match 'Error, load DLL') { throw "MkPFS subprocess smoke test failed with exit $($proc.ExitCode)" }

      - name: Package executable and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '2.20.0'
          $name = "PS5-PFS-Packager-v$version-Windows-x64"
          New-Item -ItemType Directory -Force -Path release, "release/$name" | Out-Null
          $dist = 'dist/ps5_pfs_packager.dist'
          if (!(Test-Path "$dist/PS5-PFS-Packager.exe")) { throw 'Standalone application folder missing' }
          Copy-Item "$dist/*" "release/$name/" -Recurse -Force
          Copy-Item "README.md" "release/$name/"
          New-Item -ItemType Directory -Force "release/$name/tools" | Out-Null
          Copy-Item "tools/pkgextract.exe" "release/$name/tools/pkgextract.exe"
          Copy-Item "LICENSE" "release/$name/" -ErrorAction SilentlyContinue
          foreach ($sound in @("completion.mp3","error.mp3")) {
            $source = "assets/$sound"
            if (Test-Path $source) { Copy-Item $source "release/$name/$sound" }
          }
          Compress-Archive -Path "release/$name/*" -DestinationPath "release/$name.zip" -Force
          $sha = (Get-FileHash "release/$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $name.zip" | Set-Content "release/SHA256SUMS.txt" -Encoding ascii
          if (!(Test-Path "release/$name.zip")) { throw "ZIP creation failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: PS5-PFS-Packager-v2.20.0-Windows-x64
          path: |
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v2.20.0'
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "PS5 PFS Packager $tag" --notes "Windows x64 package built from the repository with MkPFS 1.1.0. See README for instructions."
            if ($LASTEXITCODE -ne 0) { throw "Release creation failed" }
          }
          gh release upload $tag "release/PS5-PFS-Packager-v2.20.0-Windows-x64.zip" "release/SHA256SUMS.txt" --clobber --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }
